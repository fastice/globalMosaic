[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "globalMosaic"
version = "0.0.1"
description = "Global lat/lon tiling of NISAR GCOV granules and a standalone geomosaic tile driver"
authors = [
    { name = "Ian Joughin", email = "irj@uw.edu" }
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["SAR", "NISAR", "GCOV", "GrIMP", "mosaic"]
requires-python = ">=3.8"

dependencies = [
    "numpy",
    "shapely",
    "rasterio",
    "pyproj",
    "cartopy",
    "matplotlib",
    "asf_search",
    "GDAL",
    "PyYAML",
    "h5py",
    "requests"
]

[tool.setuptools]
packages = ["globalMosaic"]

[project.scripts]
globalGCOVTiles = "globalMosaic.globalGCOVTiles:main"
"globalGCOVTiles.py" = "globalMosaic.globalGCOVTiles:main"
easeTiles = "globalMosaic.easeTiles:main"
"easeTiles.py" = "globalMosaic.easeTiles:main"
coverageMaps = "globalMosaic.coverageMaps:main"
"coverageMaps.py" = "globalMosaic.coverageMaps:main"
runGeomosaicTiles = "globalMosaic.runGeomosaicTiles:main"
"runGeomosaicTiles.py" = "globalMosaic.runGeomosaicTiles:main"
installGeomosaic = "globalMosaic.installGeomosaic:main"
benchmarkASFRead = "globalMosaic.benchmarkASFRead:main"
makeGoogleEarth = "globalMosaic.makeGoogleEarth:main"
makeGoogleEarthTiered = "globalMosaic.makeGoogleEarthTiered:main"
backscatterHistograms = "globalMosaic.backscatterHistograms:main"
mosaicCoherence = "globalMosaic.mosaicCoherence:main"
globeFigure = "globalMosaic.globeFigure:main"
mosaicGaps = "globalMosaic.mosaicGaps:main"
tilesFor = "globalMosaic.tilesFor:main"
"tilesFor.py" = "globalMosaic.tilesFor:main"
gunwCoherence = "globalMosaic.gunwCoherence:main"
"gunwCoherence.py" = "globalMosaic.gunwCoherence:main"
ratioMosaic = "globalMosaic.ratioMosaic:main"
"ratioMosaic.py" = "globalMosaic.ratioMosaic:main"
"mosaicGaps.py" = "globalMosaic.mosaicGaps:main"
"globeFigure.py" = "globalMosaic.globeFigure:main"
frameStatistics = "globalMosaic.frameStatistics:main"
mosaicStatistics = "globalMosaic.mosaicStatistics:main"
notAcquired = "globalMosaic.notAcquired:main"
oceanAltitude = "globalMosaic.oceanAltitude:main"
linkOnly = "globalMosaic.linkOnly:main"
makeQuickLook = "globalMosaic.makeQuickLook:main"
monitorRun = "globalMosaic.monitorRun:main"
scanMasks = "globalMosaic.scanMasks:main"
gapReport = "globalMosaic.gapReport:main"
gapsFromPicture = "globalMosaic.gapsFromPicture:main"
"makeGoogleEarth.py" = "globalMosaic.makeGoogleEarth:main"
