# Full cycle-30 global run, descending only (paths relative to the repo root).
# Resumable: a rerun skips finished jobs. Command-line options override these values.
tileRun: cycle30/descending     # descending passes only
work: /scratch/ianj/mosaics/cycle30descending # run directory (absolute, or relative to the repo): tiles, VRTs, googleEarth/, run.log
granules: s3                   # s3 = direct S3 reads (AWS us-west-2 only) | vsicurl (anywhere) | local DIR
nProc: 24                      # single-threaded jobs, mostly waiting on downloads
res: 0.000833333333333         # latitude spacing, deg (3 arcsec)
psResM: 100                    # south polar cap (S84PS3031) spacing, m
calOutput: gamma0
featherKm: 10
retries: 2
# The south cap is one ~13 h single-threaded job (52 granules); uncomment to leave it out.
# excludeTiles: [S84PS3031]
