# Full cycle-30 ascending run at the resolution of Google Earth zoom level 11 (paths relative to the
# repo root). Level 11 pixels are 360 / (256 * 2**11) deg = 2.47"; 2.4" is the nearest spacing that
# divides the 6-deg tiles exactly (9000 px), so gdal2tiles only averages down slightly.
# Same tiling and reads as fullAsc.yaml: run time is about the same (the cap sets it), memory per
# job ~1.6x, disk ~1.6x.
tileRun: cycle30/ascending
work: /scratch/ianj/mosaics/cycle30ascending_z11   # run directory: tiles, VRTs, googleEarth/, run.log
granules: vsicurl
nProc: 24
res: 0.000666666666667         # latitude spacing, deg (2.4 arcsec)
psResM: 75                     # south polar cap spacing, m (level 11 ~ 76 m)
calOutput: gamma0
featherKm: 10
retries: 2
zoom: tiered                   # Google Earth: base 0-9, land 5-10 (smoothed), detail 7-11 where it matters
                               # (makeGoogleEarthTiered); '0-11' would do zoom 11 everywhere (~70-100 GB)
title: "NISAR gamma0, cycle 30 ascending, 2.4 arcsec (zoom to 11 where it matters)"          # name shown in Google Earth
